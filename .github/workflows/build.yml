name: FACEBOOM build and Firebase deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Test Firestore security rules
        run: npm run test:rules

      - name: Validate secure LiveKit token worker
        working-directory: workers/livekit-token
        run: |
          npm install
          npm run check

      - name: Build application
        env:
          VITE_LIVEKIT_TOKEN_URL: ${{ vars.VITE_LIVEKIT_TOKEN_URL }}
          VITE_LIVEKIT_WS_URL: ${{ vars.VITE_LIVEKIT_WS_URL }}
        run: npm run build

      - name: Deploy Firestore rules through the Firebase Rules API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FACEBOOM_46273 }}
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/faceboom-firebase-service-account.json"
          rules_payload="$RUNNER_TEMP/faceboom-ruleset.json"
          trap 'rm -f "$credential_file" "$rules_payload"' EXIT
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credential_file"
          gcloud auth activate-service-account --key-file="$credential_file" --quiet
          access_token="$(gcloud auth print-access-token)"
          api="https://firebaserules.googleapis.com/v1"
          project="faceboom-46273"
          release_name="projects/$project/releases/cloud.firestore"

          # Check Rules API access before creating or publishing anything.
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" \
            "$api/projects/$project/releases" >/dev/null

          python -c 'import json,pathlib; print(json.dumps({"source":{"files":[{"name":"firestore.rules","content":pathlib.Path("firestore.rules").read_text()}]}}))' > "$rules_payload"
          ruleset_name="$(curl --fail --silent --show-error \
            -X POST "$api/projects/$project/rulesets" \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            --data-binary "@$rules_payload" | python -c 'import json,sys; print(json.load(sys.stdin)["name"])')"

          release_url="$api/$release_name"
          if curl --fail --silent --show-error \
            -H "Authorization: Bearer $access_token" "$release_url" >/dev/null 2>&1; then
            RELEASE_NAME="$release_name" RULESET_NAME="$ruleset_name" \
              curl --fail --silent --show-error -X PATCH "$release_url" \
              -H "Authorization: Bearer $access_token" \
              -H "Content-Type: application/json" \
              --data-binary "$(RELEASE_NAME="$release_name" RULESET_NAME="$ruleset_name" python -c 'import json,os; print(json.dumps({"release":{"name":os.environ["RELEASE_NAME"],"rulesetName":os.environ["RULESET_NAME"]}}))')"
          else
            curl --fail --silent --show-error -X POST "$api/projects/$project/releases" \
              -H "Authorization: Bearer $access_token" \
              -H "Content-Type: application/json" \
              --data-binary "$(RELEASE_NAME="$release_name" RULESET_NAME="$ruleset_name" python -c 'import json,os; print(json.dumps({"name":os.environ["RELEASE_NAME"],"rulesetName":os.environ["RULESET_NAME"]}))')"
          fi

      - name: Deploy Firebase Hosting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FACEBOOM_46273 }}
          projectId: faceboom-46273
          channelId: live
